<a class="c-skip-link" href="#main-content">Vai al contenuto principale</a>

<nav class="c-nav" id="navbar" aria-label="Navigazione principale">
  <div class="c-nav__container o-container">
    <a class="c-nav__logo" routerLink="/" aria-label="Fabio Zagaria — home">
      <img
        src="assets/img/io-640.webp"
        alt=""
        aria-hidden="true"
        width="160"
        height="160"
        class="c-nav__logo-img"
      />
      <span class="c-nav__logo-text">Fabio Zagaria</span>
    </a>
    <ul class="c-nav__menu" [class.c-nav__menu--active]="isMenuOpen" id="nav-menu">
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }"
          class="c-nav__link"
          (click)="closeMenu()"
          >Home</a
        >
      </li>
      <li>
        <a
          routerLink="/about"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          class="c-nav__link"
          (click)="closeMenu()"
          >Chi sono</a
        >
      </li>
      <li>
        <a
          routerLink="/experience"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          class="c-nav__link"
          (click)="closeMenu()"
          >Esperienza</a
        >
      </li>
      <li>
        <a
          routerLink="/projects"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          class="c-nav__link"
          (click)="closeMenu()"
          >Progetti</a
        >
      </li>
      <li>
        <a
          routerLink="/contact"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          class="c-nav__link"
          (click)="closeMenu()"
          >Contatti</a
        >
      </li>
    </ul>
    <button
      type="button"
      class="theme-toggle"
      (click)="theme.toggle()"
      [attr.aria-pressed]="theme.dark()"
      [attr.aria-label]="theme.dark() ? 'Attiva tema chiaro' : 'Attiva tema scuro'"
      [title]="theme.dark() ? 'Attiva tema chiaro' : 'Attiva tema scuro'"
    >
      <svg
        class="theme-toggle__icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        @if (theme.dark()) {
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
          />
        } @else {
          <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
        }
      </svg>
    </button>
    <button
      class="c-nav__toggle"
      [class.c-nav__toggle--active]="isMenuOpen"
      (click)="toggleMenu()"
      type="button"
      aria-controls="nav-menu"
      [attr.aria-expanded]="isMenuOpen"
      [attr.aria-label]="isMenuOpen ? 'Chiudi il menu' : 'Apri il menu'"
    >
      <span class="c-nav__toggle-line"></span>
      <span class="c-nav__toggle-line"></span>
      <span class="c-nav__toggle-line"></span>
    </button>
  </div>
</nav>

@if (availabilityStatus; as status) {
  <aside
    class="c-availability-status"
    [attr.data-state]="status.state"
    role="status"
    aria-label="Stato di disponibilità"
  >
    <div class="c-availability-status__content o-container">
      <span class="c-availability-status__indicator" aria-hidden="true"></span>
      <div>
        <p class="c-availability-status__heading">
          <strong>{{ status.title }}</strong>
          <span>{{ status.dateRange }}</span>
        </p>
        <p class="c-availability-status__message">{{ status.message }}</p>
      </div>
    </div>
  </aside>
}

<main id="main-content" tabindex="-1">
  <router-outlet></router-outlet>
</main>

<footer class="c-footer">
  <div class="o-container">
    <div class="c-footer__content">
      <div class="c-footer__text">
        <p>&copy; {{ currentYear }} Fabio Zagaria. Sviluppato con Angular.</p>
      </div>
    </div>
  </div>
</footer>
