name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Inspect formatting
        run: |
          npx prettier --write ../README.md src/app/features/home/home.component.html
          echo '---README-B64---'
          base64 -w0 ../README.md
          echo
          echo '---HOME-B64---'
          base64 -w0 src/app/features/home/home.component.html
          echo

      - name: Run tests
        run: npm run test:ci

      - name: Build production application
        run: npm run build
