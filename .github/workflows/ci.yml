name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Capture formatted files
        run: |
          npx prettier --write ../README.md src/app/features/about/about.component.html src/app/features/contact/contact.component.html src/app/features/home/home.component.html src/app/features/projects/projects.component.html
          for file in ../README.md src/app/features/about/about.component.html src/app/features/contact/contact.component.html src/app/features/home/home.component.html src/app/features/projects/projects.component.html; do
            echo "FORMAT_FILE:$file"
            base64 -w 0 "$file"
            echo
          done
          exit 1

      - name: Run tests
        run: npm run test:ci

      - name: Build production application
        run: npm run build
