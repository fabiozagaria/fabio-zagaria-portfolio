name: Aggiorna commit repository portfolio

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repository-commits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Aggiorna i commit recenti
        working-directory: portfolio-angular
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repository-updates.mjs

      - name: Pubblica i dati aggiornati
        run: |
          if git diff --quiet -- portfolio-angular/src/assets/data/repository-updates.json; then
            echo "Nessun aggiornamento dei commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-angular/src/assets/data/repository-updates.json
          git commit -m "chore: aggiorna commit dei repository portfolio"
          git push
